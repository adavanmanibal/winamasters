<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WinaMasters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F6; --panel:#FFFFFF; --ink:#0B1733; --soft:#58647C; --line:#D5DBE6;
  --navy:#0B1B3A; --navy-2:#16306A; --blue:#2F6BFF; --on-navy:#FFFFFF;
  --btn-bg:#0B1B3A; --btn-ink:#FFFFFF; --danger:#C62828;
  --r-C:#8E98A8; --r-U:#6FA8C4; --r-R:#2F6BFF; --r-E:#9B5CFF; --r-Q:#12B5A6; --r-L:#E3A91F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#060D1F; --panel:#0E1A34; --ink:#E9EEF8; --soft:#95A2BC; --line:#1E2C4C; --navy:#0A1630; --btn-bg:#FFFFFF; --btn-ink:#0B1B3A; }
}
:root[data-theme="dark"]{ --bg:#060D1F; --panel:#0E1A34; --ink:#E9EEF8; --soft:#95A2BC; --line:#1E2C4C; --navy:#0A1630; --btn-bg:#FFFFFF; --btn-ink:#0B1B3A; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{max-width:100%}

/* ---------- en-tête ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);border-bottom:1px solid rgba(255,255,255,.08)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:900;font-stretch:125%;font-size:21px;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:10px;color:#fff}
.logo .mark{position:relative;width:22px;height:28px}
.logo .mark i{position:absolute;inset:0;border-radius:4px;border:2px solid #fff}
.logo .mark i:first-child{transform:rotate(-12deg) translate(-3px,1px);opacity:.45}
.logo .mark i:last-child{background:var(--blue);border-color:#fff}
.wallet{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.pill b{font-stretch:110%;font-weight:800}
.pill-cd .cdl{font-weight:600;opacity:.85}
.pill-cd b{font-variant-numeric:tabular-nums}
.brk{display:none}
@media (max-width:400px){.pill-cd .cdl{display:none}}

button.pill:hover{background:rgba(255,255,255,.18)}
.drop{width:10px;height:13px;background:#8FB3FF;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.mini-pack{width:11px;height:15px;border-radius:2px;background:#fff;display:inline-block;box-shadow:inset 0 3px 0 rgba(47,107,255,.9)}
.mini-pack.off{background:transparent;border:1.5px dashed rgba(255,255,255,.55);box-shadow:none}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 12px;font-weight:700;font-stretch:95%;color:rgba(255,255,255,.62);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--blue)}
nav.tabs .badge{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}

main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h2{font-stretch:120%;font-weight:900;font-size:28px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
h3{font-stretch:110%;font-weight:800;font-size:18px;margin:24px 0 10px}
.sub{color:var(--soft);margin:0 0 18px;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:800;font-stretch:105%;background:var(--btn-bg);color:var(--btn-ink)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--danger);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--soft)}
.field input,.field select,.field textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;color:var(--ink)}
.empty{padding:28px;border:2px dashed var(--line);border-radius:12px;color:var(--soft);text-align:center}

/* ---------- boosters ---------- */
.booster-stage{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:32px;align-items:start}
@media (max-width:760px){.booster-stage{grid-template-columns:1fr}}
.stock{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.stock .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.stock .big{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.stock .slots{display:flex;gap:6px}
.stock .slot{width:26px;height:36px;border-radius:5px;background:linear-gradient(160deg,var(--navy-2),#0B1B3A);box-shadow:inset 0 5px 0 var(--blue),0 2px 6px rgba(11,27,58,.25)}
.stock .slot.off{background:transparent;border:2px dashed var(--line);box-shadow:none}
.stock .n{font-weight:900;font-stretch:115%;font-size:22px;line-height:1.1}
.stock .next{font-size:13.5px;color:var(--soft)}
.stock .next b{color:var(--ink)}
.stock .rule{font-size:12.5px;color:var(--soft);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pack{position:relative;aspect-ratio:3/4.2;border-radius:10px;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px 18px;
  background:radial-gradient(120% 70% at 25% 10%,rgba(88,140,255,.55),transparent 60%),linear-gradient(165deg,#1B3A80 0%,#0B1B3A 55%,#050C1E 100%);
  box-shadow:0 18px 40px rgba(6,13,31,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.pack::before{top:0;border-bottom:1px solid rgba(255,255,255,.2)}
.pack::after{bottom:0;border-top:1px solid rgba(255,255,255,.2)}
.pack .sheen{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 48%,transparent 56%);transform:translateX(-60%);transition:transform .9s ease;pointer-events:none}
.pack:hover .sheen{transform:translateX(60%)}
.pack .mono{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-weight:900;font-stretch:125%;font-size:40px;letter-spacing:-.04em;background:rgba(255,255,255,.06)}
.pack .t{font-stretch:125%;font-weight:900;font-size:24px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.pack .s{font-weight:600;font-size:12px;opacity:.75;text-align:center}
.pack .g{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#fff;color:#0B1B3A;border-radius:999px;padding:4px 10px;margin-top:4px}
.pack.empty-pack{filter:saturate(.3) brightness(.8)}
.pack.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.booster-stage .row .btn{flex:1 1 100%}
.pull-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}

/* ---------- cartes ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{--b:#333;--a:#ddd;--rc:var(--r-C);position:relative;aspect-ratio:5/7.4;border-radius:12px;padding:5px;color:#fff;display:flex;flex-direction:column;border:0;text-align:left;width:100%;overflow:hidden;isolation:isolate;box-shadow:0 4px 14px rgba(6,13,31,.18);
  background:linear-gradient(145deg,#D4D9E2,#8E98A8 55%,#C4CAD5)}
.card.r-U{--rc:var(--r-U);background:linear-gradient(145deg,#F3F7FB,#9DB4C8 45%,#E9F0F6 70%,#8FA6BB)}
.card.r-R,.card.r-E{padding:6px}
.card.r-L{padding:7px}
.card.r-R{--rc:var(--r-R);background:linear-gradient(145deg,#A9C4FF,#2F6BFF 45%,#173C9C 75%,#6E98FF);box-shadow:0 4px 14px rgba(6,13,31,.18),0 0 14px rgba(47,107,255,.35)}
.card.r-E{--rc:var(--r-E);background:linear-gradient(145deg,#E3CCFF,#9B5CFF 45%,#4E1FA3 75%,#C49BFF);box-shadow:0 4px 14px rgba(6,13,31,.18),0 0 18px rgba(155,92,255,.45)}
.card.r-L{--rc:var(--r-L);background:linear-gradient(115deg,#8A6212,#F7E08A 18%,#C9951E 34%,#FFF6CF 50%,#B8861A 66%,#F3D56B 82%,#8A6212);background-size:250% 250%;animation:gold 5s linear infinite;box-shadow:0 0 0 1px rgba(255,220,120,.6),0 6px 26px rgba(227,169,31,.55)}
@keyframes gold{0%{background-position:0% 50%}100%{background-position:250% 50%}}
.card .inner{position:relative;flex:1;display:flex;flex-direction:column;background:var(--b);border-radius:8px;padding:7px;min-height:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.card .inner::before{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.18));pointer-events:none}
.card .ct{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;font-stretch:90%;gap:4px}
.card .brand{background:var(--a);color:var(--b);padding:1px 6px;border-radius:4px}
.card .rlab{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:900;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.35);color:#fff;white-space:nowrap}
.card.r-U .rlab{background:#DDE7F0;color:#28465E}
.card.r-R .rlab{background:var(--r-R);color:#fff}
.card.r-E .rlab{background:var(--r-E);color:#fff}
.card.r-L .rlab{background:linear-gradient(90deg,#F7E08A,#D9A21E);color:#3A2600}
.card .art{position:relative;flex:1;min-height:0;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.28),rgba(255,255,255,0) 70%),rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .art svg{height:78%;width:auto}
.card .art img{width:100%;height:100%;object-fit:contain}

/* ===== Épique : diamant ===== */
.card.r-E{background:linear-gradient(145deg,#F4F7FF,#9FB0D6 30%,#FFFFFF 50%,#8C9CC4 70%,#E8EEFF);box-shadow:0 0 0 1px rgba(200,215,255,.8),0 6px 24px rgba(120,150,255,.45)}
.card.r-E .inner{color:#13203F;background:linear-gradient(125deg,#DCE4F2 0%,#FFFFFF 18%,#C9D4E8 32%,#F6F9FF 46%,#B9C7E0 60%,#FFFFFF 76%,#D2DBEC 100%);background-size:220% 220%;animation:metal 7s ease-in-out infinite alternate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.card.r-E .inner::before{background:conic-gradient(from 0deg at 70% 30%,rgba(255,120,200,.28),rgba(120,200,255,.28),rgba(160,255,200,.28),rgba(255,230,120,.28),rgba(200,140,255,.28),rgba(255,120,200,.28));mix-blend-mode:color;opacity:.9}
.card.r-E .rlab{background:#13203F;color:#fff}
.card.r-E .st span{background:rgba(19,32,63,.1);color:#13203F}
.card.r-E .nm{text-shadow:0 1px 0 rgba(255,255,255,.7)}
.card.r-E .art{background:radial-gradient(circle at 50% 40%,#2A3F78,#0B1433 75%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}

/* ===== Légendaire : or ===== */
.card.r-L{animation:none;background:linear-gradient(145deg,#5A3C08,#C9951E 30%,#6E4A0B 55%,#E7B84A 80%,#5A3C08);box-shadow:0 0 0 1px rgba(255,220,120,.7),0 8px 30px rgba(227,169,31,.6)}
.card.r-L .inner{color:#2B1A00;background:linear-gradient(125deg,#8A5E10 0%,#E9BE4C 14%,#FFF3C4 28%,#D9A62A 42%,#F7DB7A 56%,#A87818 72%,#F2D06A 86%,#8A5E10 100%);background-size:240% 240%;animation:metal 6s ease-in-out infinite alternate;box-shadow:inset 0 0 0 1px rgba(255,245,200,.8),inset 0 0 18px rgba(90,55,0,.35)}
.card.r-L .inner::before{background:radial-gradient(2px 2px at 14% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 12%,#fff,transparent),radial-gradient(2px 2px at 88% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 50% 94%,#fff,transparent);animation:twinkle 2.4s ease-in-out infinite alternate}
.card.r-L .rlab{background:#2B1A00;color:#F7DB7A}
.card.r-L .st span{background:rgba(70,40,0,.16);color:#2B1A00}
.card.r-L .nm{text-shadow:0 1px 0 rgba(255,240,190,.8)}
.card.r-L .ds{opacity:.85}
.card.r-L .art{background:radial-gradient(circle at 50% 40%,#4A3108,#140C01 78%);box-shadow:inset 0 0 0 1px rgba(255,225,140,.75),0 0 0 1px rgba(90,55,0,.4)}

/* reflet qui fait l'aller-retour sur toute la carte */
.card.r-E::after,.card.r-L::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:55%;z-index:4;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.08) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,.08) 70%,transparent 100%);
  mix-blend-mode:overlay;animation:shine 2.8s ease-in-out infinite alternate}
.card.r-E::after{animation-duration:3.4s}
@keyframes shine{0%{transform:translateX(-110%) skewX(-18deg)}100%{transform:translateX(210%) skewX(-18deg)}}
@keyframes metal{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes twinkle{0%{opacity:.2}100%{opacity:1}}
.card.locked::after,.card.locked .inner::before{display:none}
.card.locked .inner{animation:none}
.card .nm{position:relative;font-weight:800;font-stretch:88%;font-size:14px;line-height:1.1;min-height:2.2em}
.card .ds{position:relative;font-size:10.5px;line-height:1.25;opacity:.88;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .st{position:relative;display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:800;font-stretch:90%}
.card .st span{background:rgba(0,0,0,.28);padding:2px 6px;border-radius:4px}
.card .cnt{position:absolute;right:5px;bottom:5px;z-index:3;background:#fff;color:#0B1B3A;font-weight:900;font-size:11px;padding:3px 7px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap}
.card.locked{filter:grayscale(1) brightness(.6);opacity:.5;animation:none}
.card.locked .art svg,.card.locked .art img{opacity:.25}
.card.locked .art::before,.card.locked .art::after{display:none}
button.card{transition:transform .15s}
button.card:hover{transform:translateY(-3px)}

/* retournement */
.flip{perspective:900px;aspect-ratio:5/7.4;background:none;border:0;padding:0}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .face,.flip .back{position:absolute;inset:0;backface-visibility:hidden}
.flip .face{transform:rotateY(180deg)}
.flip .back{border-radius:12px;background:radial-gradient(100% 60% at 30% 15%,rgba(88,140,255,.5),transparent 60%),linear-gradient(165deg,#1B3A80,#0B1B3A 60%,#050C1E);display:flex;align-items:center;justify-content:center;overflow:hidden}
.flip .back::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.5);border-radius:8px}
.flip .back span{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-stretch:125%;font-weight:900;color:#fff;font-size:30px}
.cback.hint-R,.flip .back.hint-R{box-shadow:0 0 0 3px var(--r-R),0 0 16px rgba(47,107,255,.6)}
.flip .back.hint-E,.cback.hint-E{box-shadow:0 0 0 3px #DCE6FF,0 0 22px rgba(200,215,255,.85)}
.cback.hint-L,.flip .back.hint-L{box-shadow:0 0 0 3px var(--r-L),0 0 28px rgba(227,169,31,.9);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--r-L),0 0 8px rgba(227,169,31,.5)}}

/* ---------- collection ---------- */
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.prog[aria-pressed="true"]{outline:2px solid var(--blue)}
.prog .n{font-weight:800;font-stretch:110%}
.prog .bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.prog .bar i{display:block;height:100%}
.prog small{color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.chip .k{opacity:.65;font-weight:600;margin-left:4px}

/* ---------- listes ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.item .ttl{font-weight:800;font-stretch:95%}
.item .meta{color:var(--soft);font-size:13px}
.item .price{font-weight:900;font-stretch:115%;font-size:18px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
@media (max-width:560px){.item{grid-template-columns:64px 1fr}.item .act{grid-column:1/-1}}
.lb{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.lb th,.lb td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.lb th{font-size:12px;color:var(--soft);font-weight:700}
.lb tr.me td{background:rgba(47,107,255,.12)}
.lb td.rk{font-weight:900;font-stretch:115%;width:48px}
.tablewrap{overflow-x:auto}
.feed{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.feed h3{margin:0 0 8px;font-size:15px}
.feed li{font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line);list-style:none}
.feed ul{margin:0;padding:0;max-height:260px;overflow:auto}
.feed li:last-child{border-bottom:0}
.feed .when{color:var(--soft);font-size:12px;margin-left:6px}

/* ---------- fenêtres ---------- */
dialog{border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--ink);max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(6,13,31,.6)}
.mdl{display:grid;grid-template-columns:190px 1fr;gap:18px;padding:18px}
@media (max-width:520px){.mdl{grid-template-columns:1fr}.mdl>.card{max-width:200px;margin:0 auto}}
.mdl h4{margin:0;font-stretch:115%;font-weight:900;font-size:20px;line-height:1.1}
.mdl .acts{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.mdl .box{border-top:1px solid var(--line);padding-top:10px}
.close{position:absolute;top:8px;right:10px;background:none;border:0;font-size:22px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.admin-row{display:grid;grid-template-columns:70px 1.6fr 1fr 1fr 2fr 60px 60px 100px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-width:900px}
.admin-row input,.admin-row select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:100%}
.admin-row.off{opacity:.5}

/* ===== vrais boosters ===== */
.bstage{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}

.packs{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;min-height:200px}
.bpw{display:flex;flex-direction:column;align-items:center}
.bp{--rx:0deg;--ry:0deg;--mx:30%;position:relative;display:block;width:min(260px,42vw);aspect-ratio:220/340;border:0;padding:0;background:none;cursor:pointer;perspective:900px}
.bp-in{position:absolute;inset:0;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease-out;filter:drop-shadow(0 18px 22px rgba(6,13,31,.45))}

.bpf{position:absolute;inset:0;clip-path:var(--zz);overflow:hidden;color:#fff;container-type:inline-size;
  background:
   linear-gradient(115deg,transparent 0,transparent calc(var(--mx) - 20%),rgba(255,255,255,.26) var(--mx),transparent calc(var(--mx) + 20%)),
   repeating-linear-gradient(97deg,rgba(255,255,255,.035) 0 2px,transparent 2px 11px),
   repeating-linear-gradient(8deg,rgba(0,0,0,.06) 0 3px,transparent 3px 17px),
   radial-gradient(120% 60% at 20% 8%,rgba(96,150,255,.55),transparent 60%),
   radial-gradient(80% 50% at 90% 95%,rgba(47,107,255,.35),transparent 60%),
   linear-gradient(165deg,#1C3C86 0%,#0C1D40 50%,#050B1C 100%)}
.bpf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 12%,transparent 88%,rgba(0,0,0,.35));pointer-events:none}
.bpf .crimp{position:absolute;left:0;right:0;height:9%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,rgba(0,0,0,.28) 2px 4px),linear-gradient(180deg,#9DB3E2,#34508F)}
.bpf .crimp.t{top:0}.bpf .crimp.b{bottom:0}
.bpf .tear{position:absolute;left:5%;right:5%;top:14.4%;border-top:1.5px dashed rgba(255,255,255,.55)}
.bpf .tear::after{content:"déchirer ici";position:absolute;right:0;top:-14px;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.bpf .body{position:absolute;inset:19% 7% 15%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center}
.bpf .holo{width:40%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-stretch:125%;font-size:clamp(28px,5vw,46px);color:#0B1B3A;
  background:conic-gradient(from var(--ang,0deg),#ffd6e8,#fff3b0,#c8ffd9,#b8e6ff,#dccbff,#ffd6e8);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 24px rgba(160,190,255,.6),inset 0 -6px 12px rgba(0,0,0,.15)}
.bpf .ttl{font-weight:900;font-stretch:125%;font-size:clamp(15px,2.6vw,21px);letter-spacing:.03em;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bpf .ed{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.bpf .brands{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.bpf .brands i{font-style:normal;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;background:var(--c);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.bpf .count{font-weight:900;font-size:11px;letter-spacing:.12em;background:#fff;color:#0B1B3A;padding:4px 10px;border-radius:999px}
.bpf .foot{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
@container (max-width:210px){.bpf .foot{display:none}.bpf .body{gap:6px;inset:18% 6% 12%}.bpf .brands i{font-size:8px;padding:1px 4px}.bpf .tear::after{font-size:7.5px}}
.bp-label{margin-top:12px;text-align:center;font-weight:700;font-size:13.5px;color:var(--soft)}
.lastpull{display:flex;gap:14px;flex-wrap:wrap}

/* ===== ouverture ===== */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#16306A,#030814 75%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));color:#fff;animation:fadein .25s;overflow:auto}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}

.ov .hint{font-weight:700;opacity:.85;font-size:15px;min-height:1.4em;text-align:center}
.ov .hint.small{font-size:13px;opacity:.65;font-weight:600}
.ov .btn{background:#fff;color:#0B1B3A}
.ov .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.op{position:relative;display:block;width:min(300px,68vw);aspect-ratio:220/340;cursor:pointer;border:0;padding:0;background:none;color:inherit}
.op>.layer{position:absolute;inset:0;filter:drop-shadow(0 26px 34px rgba(0,0,0,.55))}
.op>.layer .bp-in{filter:none}
.op .p-top{clip-path:polygon(0 0,100% 0,100% 14.6%,93% 15.9%,86% 14.2%,79% 15.7%,72% 14%,65% 15.8%,58% 14.3%,51% 16%,44% 14.1%,37% 15.6%,30% 14.2%,23% 15.9%,16% 14.4%,9% 15.7%,0 14.5%)}
.op .p-body{clip-path:polygon(0 14.5%,9% 15.7%,16% 14.4%,23% 15.9%,30% 14.2%,37% 15.6%,44% 14.1%,51% 16%,58% 14.3%,65% 15.8%,72% 14%,79% 15.7%,86% 14.2%,93% 15.9%,100% 14.6%,100% 100%,0 100%)}
.op .peek{position:absolute;left:13%;right:13%;top:12%;bottom:22%;border-radius:10px;background:radial-gradient(100% 60% at 30% 15%,rgba(88,140,255,.5),transparent 60%),linear-gradient(165deg,#1B3A80,#0B1B3A 60%,#050C1E);box-shadow:0 0 0 2px rgba(255,255,255,.6),6px 6px 0 -2px #16306A,12px 12px 0 -4px #0B1B3A;opacity:0;transform:translateY(25%)}
.op.shake{animation:tug .45s}
@keyframes tug{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg) scale(1.03)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.op.torn .p-top{transition:transform .75s cubic-bezier(.25,.7,.3,1),opacity .75s;transform:translate(110px,-240px) rotate(32deg);opacity:0}
.op.drop .p-body{transition:transform .65s cubic-bezier(.55,0,.75,.35),opacity .65s;transform:translateY(80%);opacity:0}
.op.drop .peek{transition:transform .6s .05s cubic-bezier(.2,.8,.2,1),opacity .3s;transform:translateY(-18%);opacity:1}
.rv{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.bigwrap{position:relative;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.bigin{position:absolute;left:0;top:0;width:200px;transform-origin:top left}
.bigin .flip{width:200px;display:block;cursor:pointer}
.bigwrap .burst{position:absolute;inset:-35%;pointer-events:none;border-radius:50%;opacity:0}
.bigwrap .burst.go-L{background:radial-gradient(circle,rgba(255,214,90,.75),rgba(255,214,90,.15) 45%,transparent 65%);animation:burst 1.3s ease-out}
.bigwrap .burst.go-E{background:radial-gradient(circle,rgba(210,225,255,.75),rgba(210,225,255,.12) 45%,transparent 65%);animation:burst 1.1s ease-out}
.bigwrap .burst.go-R{background:radial-gradient(circle,rgba(47,107,255,.6),transparent 60%);animation:burst .9s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.rv-title{font-weight:900;font-stretch:115%;font-size:20px;text-align:center;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:28px}
.minis{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mini{position:relative;border:0;padding:0;background:none;opacity:.5;transition:opacity .2s,transform .2s;cursor:pointer}
.mini.seen{opacity:.95}
.mini.cur{opacity:1;transform:translateY(-6px);outline:2px solid #fff;outline-offset:3px;border-radius:10px}
.rv-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.summary{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1100px}
.sc{position:relative;flex:none}
.sc>.sci{position:absolute;left:0;top:0;width:200px;transform-origin:top left}
.cback{position:relative;width:200px;aspect-ratio:5/7.4;border-radius:12px;background:radial-gradient(100% 60% at 30% 15%,rgba(88,140,255,.5),transparent 60%),linear-gradient(165deg,#1B3A80,#0B1B3A 60%,#050C1E);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cback::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.5);border-radius:8px}
.cback span{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-stretch:125%;font-weight:900;color:#fff;font-size:30px}

/* ===== zoom & échanges ===== */

.linkbtn.light{color:rgba(255,255,255,.6)}
.ov .big-hint{font-weight:900;font-stretch:115%;font-size:24px;text-align:center}
.deck{position:relative;touch-action:pan-y}
.deck-in{position:absolute;left:0;top:0;width:200px;height:296px;transform-origin:top left}

@keyframes comeup{from{transform:translate(7px,6px) rotate(2.2deg)}}
.dk.top.leave{transition:transform .38s cubic-bezier(.5,0,.8,.5),opacity .38s;transform:translateX(-135%) rotate(-16deg);opacity:0}
.deck .burst{position:absolute;inset:-35%;pointer-events:none;border-radius:50%;opacity:0;z-index:0}
.deck .burst.go-L{background:radial-gradient(circle,rgba(255,214,90,.75),rgba(255,214,90,.15) 45%,transparent 65%);animation:burst 1.3s ease-out}

.dots{display:flex;gap:9px;justify-content:center;align-items:center}

.tb-trays{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.tb-tray{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:64px}
.tb-lbl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.tb-arrow{align-self:center;font-size:22px;font-weight:900;color:var(--soft)}
.tb-sel{display:flex;flex-wrap:wrap;gap:6px}
.tb-empty{font-size:13px;color:var(--soft)}
.tb-chip{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:700;max-width:100%}
.tb-chip .tb-cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.tb-chip .tb-x{color:var(--soft);font-weight:900}
.tb-thumb{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--b);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tb-thumb img,.tb-thumb svg{width:100%;height:100%;object-fit:contain}
.tb-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb-tabs input{flex:1 1 140px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.tb-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;align-content:start;padding:2px}
.tb-tile{display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:left;cursor:pointer;position:relative}
.tb-tile.on{border-color:#2F6BFF;background:rgba(47,107,255,.08)}
.tb-tile[disabled]{opacity:.55;cursor:default}
.tb-tile.r-L{border-color:#E3A91F}.tb-tile.r-S{border-color:#a97dff}.tb-tile.r-Q{border-color:#12B5A6}.tb-tile.r-E{border-color:#9FB0D6}
.tb-tile.on.r-L,.tb-tile.on.r-S,.tb-tile.on.r-Q,.tb-tile.on.r-E{box-shadow:0 0 0 3px #2F6BFF}
.tb-art{position:relative;aspect-ratio:5/4;border-radius:8px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.3),transparent 70%),var(--b);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb-art img{width:100%;height:100%;object-fit:contain}.tb-art svg{height:78%;width:auto}
.tb-n{position:absolute;top:4px;right:4px;background:#2F6BFF;color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:1px 7px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tb-name{font-size:12px;font-weight:800;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.tb-meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.tb-meta .rpill{font-size:8.5px;padding:1px 6px}
.tb-tag{font-size:10.5px;font-weight:800;color:var(--soft)}.tb-tag.miss{color:#0E8F83}
.tb-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.tb-note{flex:1;margin:0;font-size:13px;color:var(--soft)}.tb-note.bad{color:var(--danger);font-weight:700}
.tmulti{display:grid;grid-template-columns:repeat(2,auto);gap:4px;justify-content:center}
.tside.multi{width:auto}
@media (max-width:700px){
  dialog.tb-dlg{max-width:100vw;width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  .tb{padding:12px}
  .tb-trays{grid-template-columns:1fr;gap:6px}.tb-arrow{display:none}
  .tb-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .tb-foot{flex-direction:column;align-items:stretch}.tb-foot .btn{width:100%}
}
.dls{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.dl{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dl-stake{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:14px;padding:5px 10px;border-radius:999px;background:rgba(47,107,255,.12)}
.dl-stake.free{background:var(--line);font-size:12px;font-weight:800}
.dl-t{flex:1;font-size:14px;line-height:1.4}
.dl-a{display:flex;gap:6px;flex:0 0 auto}
.dl-res{font-weight:900}.dl-res.win{color:#0E8F83}.dl-res.lose{color:#E03131}.dl-res.tie{color:var(--soft)}
.qz-endline{margin:0 0 12px;font-size:16px;text-align:center}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;margin-bottom:10px}
.fl select,.fl input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
@media (max-width:560px){.dl{flex-wrap:wrap}.dl-a{width:100%;justify-content:flex-end}}

.quiz-banner{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 18px;padding:12px 16px;border-radius:14px;border:2px solid #2F6BFF;background:linear-gradient(90deg,#E8F0FF,#D6E4FF);color:#0B1B3A;text-align:left;cursor:pointer}
.quiz-banner small{color:#3a4a6a}
.quiz-banner .go{margin-left:auto;background:#2F6BFF;color:#fff;padding:8px 14px;border-radius:10px;font-weight:800;font-size:14px;white-space:nowrap}
.qz-ico{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#2F6BFF;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;font-stretch:120%}
.qz-ico.big{width:72px;height:72px;font-size:40px;margin:0 auto 6px}
@media (max-width:560px){.quiz-banner .go{display:none}}
.qz-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;margin:0 auto 18px}
.qz-intro{text-align:center}.qz-intro h3{margin:4px 0 10px;font-size:22px}
.qz-intro ul{text-align:left;margin:0 auto 18px;padding-left:20px;max-width:440px;line-height:1.6;font-size:15px}
.qz-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;font-weight:800}
.qz-brand{color:#fff;padding:3px 10px;border-radius:999px;font-size:12px;letter-spacing:.03em}
.qz-step{color:var(--soft)}.qz-score{margin-left:auto;color:#12B5A6}
.qz-time{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:14px}
.qz-time i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2F6BFF,#5EEAD4);border-radius:999px;transition:width .1s linear}
.qz-time i.low{background:linear-gradient(90deg,#E03131,#FF8A5B)}
.qz-q{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:14px}
.qz-opts{display:grid;gap:10px}
.qz-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:15px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.qz-opt:not([disabled]):hover{border-color:#2F6BFF}
.qz-l{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.qz-opt.good{border-color:#12B5A6;background:rgba(18,181,166,.14)}.qz-opt.good .qz-l{background:#12B5A6;color:#fff}
.qz-opt.bad{border-color:#E03131;background:rgba(224,49,49,.12)}.qz-opt.bad .qz-l{background:#E03131;color:#fff}
.qz-opt[disabled]{cursor:default}
.qz-fb{margin:14px 0 12px;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.45}
.qz-fb.ok{background:rgba(18,181,166,.12);border:1px solid rgba(18,181,166,.5)}.qz-fb.ko{background:rgba(224,49,49,.08);border:1px solid rgba(224,49,49,.35)}
.qz-end{text-align:center}.qz-big{font-size:56px;font-weight:900;font-stretch:120%;line-height:1}
.qz-gain{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:999px;background:rgba(47,107,255,.14);font-weight:900;font-size:18px}
.qz-board{margin:0;padding:0;list-style:none}
.qz-board li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.qz-board li:last-child{border-bottom:0}.qz-board li.me{font-weight:800}
.qz-board .n{width:22px;color:var(--soft);font-weight:800}.qz-board .v{margin-left:auto;color:var(--soft);font-size:13px}
/* ===== Équipe : badge d'entreprise ===== */
.card.r-Q{--rc:var(--r-Q);padding:6px;background:linear-gradient(160deg,#FFFFFF,#E4EAF2 55%,#C9D3E0);box-shadow:0 0 0 1px rgba(18,181,166,.55),0 6px 22px rgba(18,181,166,.35)}
.card.r-Q .inner{color:#13203F;background:#FFFFFF;padding:0 7px 7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(19,32,63,.12)}
.card.r-Q .inner::before{background:linear-gradient(180deg,var(--b) 0,var(--b) 34px,transparent 34px),repeating-linear-gradient(135deg,transparent 0 10px,rgba(18,181,166,.05) 10px 20px);opacity:1}
.card.r-Q .slot{position:relative;align-self:center;width:34px;height:7px;margin:6px 0 2px;border-radius:999px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35)}
.card.r-Q .ct{color:#fff}
.card.r-Q .brand{background:transparent;color:#fff;padding:0;letter-spacing:.04em;text-transform:uppercase}
.card.r-Q .rlab{background:linear-gradient(90deg,#5EEAD4,#12B5A6);color:#053B36}
.card.r-Q .art{margin:8px 6px 5px;border-radius:8px;background:radial-gradient(circle at 50% 35%,#fff,transparent 70%),linear-gradient(160deg,var(--a),color-mix(in srgb,var(--a) 55%,var(--b)));box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(19,32,63,.2)}
.card.r-Q .nm{min-height:0;text-align:center;font-size:14px}
.card.r-Q .job{position:relative;text-align:center;font-size:8.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--b);margin-top:2px}
.card.r-Q .ds{text-align:center;-webkit-line-clamp:3;font-size:9.5px;line-height:1.2;margin-top:2px}
.card.r-Q .st{margin-top:auto;padding-top:4px}
.card.r-Q .st span{background:rgba(19,32,63,.08);color:#13203F}
.card.r-Q::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:55%;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(94,234,212,.08) 30%,rgba(255,255,255,.7) 50%,rgba(94,234,212,.08) 70%,transparent 100%);mix-blend-mode:overlay;animation:shine 3.1s ease-in-out infinite alternate}
.card.locked.r-Q .inner::before{display:block;background:linear-gradient(180deg,#666 0,#666 34px,transparent 34px)}
.rpill.r-Q{background:linear-gradient(90deg,#5EEAD4,#12B5A6);color:#053B36}
.dots i.r-Q.seen{background:#5EEAD4}
.cback.hint-Q,.flip .back.hint-Q{box-shadow:0 0 0 3px #5EEAD4,0 0 22px rgba(18,181,166,.85)}
.deck .burst.go-Q,.bigwrap .burst.go-Q{background:radial-gradient(circle,rgba(94,234,212,.75),rgba(94,234,212,.15) 45%,transparent 65%);animation:burst 1.2s ease-out}
.team{margin:0 0 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.team h3{margin:0 0 4px;font-size:15px}
.team p{margin:0 0 10px;color:var(--soft);font-size:13px}
.team-row{display:flex;gap:8px;flex-wrap:wrap}
.team-b{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;background:transparent;color:inherit}
.team-b i{width:10px;height:10px;border-radius:50%}
.team-b small{font-weight:600;color:var(--soft)}
.team-b.done{border-color:#12B5A6;background:rgba(18,181,166,.1)}
.team-b.done small{color:#0E8F83}

/* ===== Shiny : holographique arc-en-ciel ===== */
.card.r-S{padding:7px;background:linear-gradient(90deg,#ff5fc1,#ffd45e,#6dffac,#5ec8ff,#a97dff,#ff5fc1);background-size:300% 300%;animation:holo 3.5s linear infinite;box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 22px rgba(190,130,255,.75),0 0 44px rgba(94,200,255,.45)}
.card.r-S .inner{color:#1A1030;background:linear-gradient(125deg,#FFC2EA 0%,#FFEBA6 15%,#B8FFD6 30%,#B6E6FF 45%,#D6C2FF 60%,#FFC2EA 75%,#FFEBA6 90%,#B8FFD6 100%);background-size:260% 260%;animation:metal 4s ease-in-out infinite alternate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95)}
.card.r-S .inner::before{background:
  radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(2.5px 2.5px at 86% 14%,#fff,transparent),radial-gradient(2px 2px at 90% 68%,#fff,transparent),radial-gradient(2px 2px at 8% 88%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 95%,#fff,transparent),radial-gradient(2px 2px at 30% 60%,#fff,transparent),
  repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 10px,rgba(255,255,255,.28) 10px 12px);animation:twinkle 1.6s ease-in-out infinite alternate}
.card.r-S .rlab{background:linear-gradient(90deg,#ff5fc1,#ffd45e,#6dffac,#5ec8ff,#a97dff);color:#1A1030;box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.card.r-S .st span{background:rgba(26,16,48,.12);color:#1A1030}
.card.r-S .nm{text-shadow:0 1px 0 rgba(255,255,255,.8)}
.card.r-S .ds{opacity:.85}
.card.r-S .art{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.14),transparent 70%),linear-gradient(90deg,#4A2C8A,#15407A,#0F5A4A,#6A2A6E,#4A2C8A);background-size:100% 100%,300% 300%;animation:holo 6s linear infinite;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 0 12px rgba(169,125,255,.6)}
.card.r-S .art::after{display:none}
.card.r-S::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:55%;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.1) 30%,rgba(255,255,255,.85) 50%,rgba(255,255,255,.1) 70%,transparent 100%);mix-blend-mode:overlay;animation:shine 2.2s ease-in-out infinite alternate}
@keyframes holo{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.card.locked.r-S{animation:none}
.cback.hint-S,.flip .back.hint-S{animation:rainglow 1.6s linear infinite}
@keyframes rainglow{0%{box-shadow:0 0 0 3px #ff5fc1,0 0 32px #ff5fc1}25%{box-shadow:0 0 0 3px #ffd45e,0 0 32px #ffd45e}50%{box-shadow:0 0 0 3px #6dffac,0 0 32px #6dffac}75%{box-shadow:0 0 0 3px #5ec8ff,0 0 32px #5ec8ff}100%{box-shadow:0 0 0 3px #ff5fc1,0 0 32px #ff5fc1}}
.deck .burst.go-S,.bigwrap .burst.go-S{background:conic-gradient(from 0deg,rgba(255,95,193,.7),rgba(255,212,94,.7),rgba(109,255,172,.7),rgba(94,200,255,.7),rgba(169,125,255,.7),rgba(255,95,193,.7));-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);animation:burst 1.6s ease-out}
.rpill.r-S{background:linear-gradient(90deg,#ff5fc1,#ffd45e,#6dffac,#5ec8ff,#a97dff);color:#1A1030}
.dots i.r-S.seen{background:conic-gradient(#ff5fc1,#ffd45e,#6dffac,#5ec8ff,#a97dff,#ff5fc1)}

.ov-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:5}
.ov-x:hover{background:rgba(255,255,255,.18)}
.bp-tag{position:absolute;top:10%;left:-6px;z-index:6;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;background:#FFFFFF;color:#0B1B3A;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.bpf.gold{color:#3A2600;background:
   linear-gradient(115deg,transparent 0,transparent calc(var(--mx,30%) - 20%),rgba(255,255,255,.55) var(--mx,30%),transparent calc(var(--mx,30%) + 20%)),
   repeating-linear-gradient(97deg,rgba(255,255,255,.08) 0 2px,transparent 2px 11px),

.bpf.gold .ttl{text-shadow:0 1px 0 rgba(255,245,200,.8)}
.bpf.gold .holo{background:radial-gradient(circle at 35% 30%,#FFFBE6,#F2C94C 60%,#B8861A);box-shadow:0 0 0 3px rgba(255,255,255,.7),0 0 24px rgba(255,220,120,.9)}
.bpf.gold .count{background:#3A2600;color:#F7DB7A}
.bpf.gold .tear{border-top-color:rgba(58,38,0,.55)}
.bp-tag.gold{background:#3A2600;color:#F7DB7A}
.btn.open-cta.gold{background:linear-gradient(90deg,#F7DB7A,#D9A62A);color:#3A2600}
.gold-prog{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.gold-prog .pips{display:flex;gap:5px}.gold-prog .pips i{width:14px;height:14px;border-radius:50%;background:var(--line)}.gold-prog .pips i.on{background:linear-gradient(135deg,#F7DB7A,#D9A62A);box-shadow:0 0 6px rgba(227,169,31,.7)}
.bp-tag.bought{background:#F2C94C;color:#3A2600}
.stock .reserve{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px}

/* pile de cartes (v10) */
.dk{transition:transform .38s cubic-bezier(.3,.8,.3,1),opacity .3s ease;will-change:transform}
.dk .flip{width:200px;display:block;cursor:pointer;pointer-events:none}
.dk.front .flip{pointer-events:auto}
.dk:not(.front) .back{box-shadow:0 6px 18px rgba(0,0,0,.45)!important;animation:none!important}
.dk .flip .fi{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ov{touch-action:manipulation}
/* joueurs cliquables */
.plink{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:rgba(47,107,255,.5);text-underline-offset:3px;cursor:pointer}
.plink:hover{color:var(--blue)}
.lb td .plink{font-weight:700}
.back{display:inline-block;margin-bottom:10px;color:var(--soft)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pcard{position:relative;border:0;padding:0;background:none;cursor:zoom-in;border-radius:12px}
.pcard .miss{position:absolute;left:8px;bottom:-8px;z-index:6;background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.chips+.chips{margin-top:-8px}
/* barre d'onglets */
nav.tabs .ti{display:none;width:22px;height:22px}
nav.tabs .ts{display:none}
nav.tabs button{position:relative}
@media (max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:none;margin:0;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:0;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));background:var(--navy);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -6px 20px rgba(0,0,0,.25);overflow:visible}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-bottom:0;border-radius:10px;font-size:10.5px;min-width:0}
  nav.tabs button[aria-selected="true"]{background:rgba(47,107,255,.22)}
  nav.tabs .ti{display:block}
  nav.tabs .tl{display:none}
  nav.tabs .ts{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px;letter-spacing:-.2px;font-stretch:85%}
  nav.tabs .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="logo"><span class="mark" aria-hidden="true"><i></i><i></i></span><span class="lname">WinaMasters</span></div>
    <div class="wallet" id="wallet"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"><div class="empty">Chargement du jeu…</div></main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* L'URL et la clé Supabase sont dans config.js (à côté de ce fichier) */
const WM = window.WM_CONFIG || {};
const SUPABASE_URL      = WM.url || "";
const SUPABASE_ANON_KEY = (WM.key && !/COLLE/.test(WM.key)) ? WM.key : "";
const LOGIN_DOMAIN      = "winamasters.adavan.fr";  // sert juste à fabriquer un identifiant interne, aucun mail n'est envoyé

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const PACK_SIZE = 5;
const RORDER = ["C","U","R","E","Q","L","S"];

let uid=null, cfg={booster_price:60,free_per_slot:2,free_hours:[10,15],is_admin:false}, bstate={available:0,bought:0,per_slot:2,next_at:null};
let RAR={}, brands={}, cards=[], cardById={};
let me=null, inv={}, players=[], listings=[], trades=[], feed=[], board=[], teamDone=[], offers=[];
let tab="booster", brandFilter="all", collFilter="all", lastPull=null, flipped=new Set(), adminDirty=false, busy=false;
let loginMode="login";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
function ts(x){return typeof x==="number"?x:Date.parse(x)}
function ago(x){const s=Math.round((Date.now()-ts(x))/1000);if(s<60)return"à l'instant";const m=Math.round(s/60);if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;return`il y a ${Math.round(h/24)} j`}
function fmtDur(ms){const m=Math.ceil(ms/60000);const h=Math.floor(m/60);return h?`${h} h ${String(m%60).padStart(2,"0")}`:`${m} min`}
function who(id){ if(id===uid) return "Toi"; const p=players.find(x=>x.id===id); return (p&&p.pseudo)||"Un collègue"; }
function errMsg(e){return (e&&(e.message||e.error_description))||"Une erreur est survenue."}
function has(id){return (inv[id]||0)>0}

/* ---------- card art ---------- */
function shapeSVG(shape){
  const s='stroke="rgba(0,0,0,.35)" stroke-width="2"';
  const A={
    spray:`<path d="M34 30h22v10H34z" fill="rgba(255,255,255,.9)" ${s}/><path d="M56 32l14 4v4l-14-2z" fill="rgba(255,255,255,.9)" ${s}/><path d="M40 40h12v8H40z" fill="var(--a)" ${s}/><path d="M34 48h24c4 0 6 3 6 7v48c0 4-3 7-7 7H35c-4 0-7-3-7-7V55c0-4 3-7 6-7z" fill="var(--a)" ${s}/><rect x="32" y="66" width="28" height="24" rx="3" fill="rgba(255,255,255,.85)"/>`,
    flacon:`<rect x="41" y="22" width="14" height="10" rx="2" fill="rgba(255,255,255,.9)" ${s}/><path d="M42 32h12l2 10c8 3 12 9 12 17v44c0 4-3 7-7 7H35c-4 0-7-3-7-7V59c0-8 4-14 12-17z" fill="var(--a)" ${s}/><rect x="34" y="66" width="28" height="26" rx="3" fill="rgba(255,255,255,.85)"/>`,
    bidon:`<path d="M58 24h10v10H58z" fill="rgba(255,255,255,.9)" ${s}/><path d="M30 36h28l12 0v68c0 4-3 6-6 6H30c-3 0-6-2-6-6V42c0-3 3-6 6-6z" fill="var(--a)" ${s}/><path d="M32 40h16v8H32z" fill="none" ${s}/><rect x="30" y="62" width="34" height="28" rx="3" fill="rgba(255,255,255,.85)"/>`,
    eponge:`<rect x="20" y="44" width="58" height="42" rx="12" fill="var(--a)" ${s}/><g fill="rgba(0,0,0,.18)"><circle cx="34" cy="56" r="4"/><circle cx="50" cy="62" r="5"/><circle cx="64" cy="54" r="3"/><circle cx="40" cy="74" r="4"/><circle cx="62" cy="74" r="5"/></g>`,
    pot:`<rect x="26" y="44" width="46" height="10" rx="3" fill="rgba(255,255,255,.9)" ${s}/><path d="M28 54h42v40c0 5-4 8-8 8H36c-4 0-8-3-8-8z" fill="var(--a)" ${s}/><rect x="32" y="64" width="34" height="20" rx="3" fill="rgba(255,255,255,.85)"/>`,
    kit:`<path d="M18 50l31-14 31 14v42l-31 14-31-14z" fill="var(--a)" ${s}/><path d="M18 50l31 14 31-14M49 64v42" fill="none" ${s}/><path d="M34 43l31 14v10" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="5"/>`,
    legende:`<path d="M49 16c6 14 20 22 20 42 0 14-9 26-20 26S29 72 29 58c0-10 5-15 9-20 0 8 3 12 7 12-2-12 2-24 4-34z" fill="var(--a)" ${s}/><rect x="26" y="88" width="46" height="18" rx="4" fill="rgba(255,255,255,.9)" ${s}/>`
  };
  return `<svg viewBox="0 0 98 120" aria-hidden="true">${A[shape]||A.flacon}</svg>`;
}
function rlabel(r){return (RAR[r]&&RAR[r].label)||r}
function cardHTML(c,{count=0,locked=false,tag="div",attrs=""}={}){
  if(!c) return "";
  const b=brands[c.brand]||{name:c.brand,color:"#333",accent:"#ddd"};
  const art=c.img?`<img src="${esc(c.img)}" alt="">`:shapeSVG(c.shape);

  return `<${tag} class="card r-${esc(c.rarity)} ${locked?"locked":""}" style="--b:${esc(b.color)};--a:${esc(b.accent)}" ${attrs} aria-label="${esc(locked?"Carte non obtenue":c.name)}, ${esc(rlabel(c.rarity))}">
    <div class="inner">${c.rarity==="Q"?`<span class="slot"></span>`:""}
      <div class="ct"><span class="brand">${esc(b.name)}</span><span class="rlab">${esc(rlabel(c.rarity))}</span></div>
      <div class="art">${locked?shapeSVG(c.shape):art}${count>1?`<span class="cnt">×${count}${dupLabel(count)?" · "+dupLabel(count):""}</span>`:""}</div>
      <div class="nm">${locked?"???":esc(c.name)}</div>${c.rarity==="Q"&&c.job?`<div class="job">${locked?"":esc(c.job)}</div>`:""}
      <div class="ds">${locked?esc(rlabel(c.rarity)):esc(c.descr)}</div>
      <div class="st"><span>ATK ${locked?"?":c.atk}</span><span>DEF ${locked?"?":c.def}</span></div>
    </div></${tag}>`;
}

/* ---------- boosters gratuits ---------- */
function tokens(){return bstate.available||0}
function reserve(){return bstate.bought||0}
function lord(){return bstate.lord||"Adavan"}
function oathOpen(){return !!bstate.oath_open}
function goldN(){return (me&&me.gold)||0}
function totalPacks(){return tokens()+reserve()+goldN()}
function hoursText(){const h=cfg.free_hours||[10,15];return h.map(x=>x+"h").join(" et ")}
function nextText(){
  if(!bstate.next_at) return "";
  const d=new Date(bstate.next_at), now=new Date();
  const tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);
  const day=d.toDateString()===now.toDateString()?"aujourd'hui":d.toDateString()===tomorrow.toDateString()?"demain":d.toLocaleDateString("fr-FR",{weekday:"long"});
  const hh=d.getHours()+"h"+(d.getMinutes()?String(d.getMinutes()).padStart(2,"0"):"");
  return `<b>${day} à ${hh}</b> · dans ${fmtDur(Math.max(0,d-now))}`;
}
function dupLabel(n){return ({2:"doublon",3:"triplon",4:"quadruplon",5:"quintuplon"})[n]||""}

/* ---------- chargement ---------- */
async function loadCatalog(){
  const [r,b,c]=await Promise.all([
    sb.from("rarities").select("*").order("ord"),
    sb.from("brands").select("*").order("sort"),
    sb.from("cards").select("*").order("sort")]);
  if(r.error||b.error||c.error) throw (r.error||b.error||c.error);
  RAR=Object.fromEntries(r.data.map(x=>[x.code,x]));
  brands=Object.fromEntries(b.data.map(x=>[x.id,x]));
  cards=c.data; cardById=Object.fromEntries(cards.map(x=>[x.id,x]));
}
async function loadGame(){
  const [p,i,pl,l,t,f,lb,bs,tb,qs,of]=await Promise.all([
    sb.from("players").select("*").eq("id",uid).single(),
    sb.from("inventory").select("card,qty").eq("player",uid),
    sb.from("players").select("id,pseudo"),
    sb.from("listings").select("*").eq("status","open").order("created_at",{ascending:false}).limit(300),
    sb.from("trades").select("*").eq("status","pending").order("created_at",{ascending:false}),
    sb.from("feed").select("*").order("created_at",{ascending:false}).order("id",{ascending:false}).limit(30),
    sb.from("leaderboard").select("*").order("score",{ascending:false}).limit(200),
    sb.rpc("booster_state"),
    sb.from("team_bonus").select("brand").eq("player",uid),
    sb.rpc("duel_list"),
    sb.from("offers").select("*").eq("status","pending").order("created_at",{ascending:false})]);
  if(p.error) throw p.error;
  teamDone=(tb&&!tb.error&&tb.data||[]).map(x=>x.brand);
  arenaOn=!!(qs&&!qs.error); duels=arenaOn?(qs.data||[]):[];
  offersOn=!!(of&&!of.error); offers=offersOn?(of.data||[]):[];
  me=p.data; inv=Object.fromEntries((i.data||[]).map(x=>[x.card,x.qty]));
  if(bs&&bs.data) bstate=bs.data;
  players=pl.data||[]; listings=l.data||[]; trades=t.data||[]; feed=f.data||[]; board=lb.data||[];
}
let reloadTimer=null;
function scheduleReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(async()=>{try{await loadGame();render()}catch(e){}},500)}
async function act(fn,okMsg){
  if(busy) return; busy=true;
  try{const r=await fn(); if(okMsg) toast(typeof okMsg==="function"?okMsg(r):okMsg); await loadGame(); render(); return r;}
  catch(e){toast(errMsg(e))}
  finally{busy=false}
}
async function rpc(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}


/* ---------- arène (duels de quiz) ---------- */
let arenaOn=false, duels=[], qcur=null, qres=null, qDeadline=0, aBoard=null, qBusy=false, qTimer=null;
const QB={gs27:"GS27",restom:"Restom",spheretech:"Spheretech",abnet:"Abnet",winalco:"Groupe Winalco"};
function arenaTodo(){return duels.filter(d=>(!d.mine&&(d.status==="waiting"||d.status==="playing_o"))||(d.mine&&d.status==="playing_c")).length}
function opp(d){return d.mine?d.opponent:d.challenger}
function hLeft(t){const ms=Date.parse(t)-Date.now(); if(ms<=0) return "expiré"; const h=Math.floor(ms/3600000); return h>=1?`${h} h`:`${Math.max(1,Math.ceil(ms/60000))} min`}
function duelRow(d){
  const o=plink(opp(d)), st=d.stake?`<span class="dl-stake"><span class="drop"></span>${d.stake}</span>`:`<span class="dl-stake free">amical</span>`;
  let txt="",acts="";
  if(d.status==="playing_c"&&d.mine){txt=`Tu as commencé ce défi contre ${o} (${d.my_idx}/${d.total})`;acts=`<button class="btn small" data-duel="${d.id}">Continuer</button>`}
  else if(d.status==="waiting"&&d.mine){txt=`Tu as fait <b>${d.c_correct}/${d.total}</b>. En attente de ${o} · expire dans ${hLeft(d.expires_at)}`;acts=`<button class="btn ghost small" data-dcancel="${d.id}">Annuler</button>`}
  else if(d.status==="waiting"){txt=`${o} te défie ! Son score est caché jusqu'à la fin · expire dans ${hLeft(d.expires_at)}`;acts=`<button class="btn small" data-daccept="${d.id}" ${me.coins<d.stake?"disabled":""}>Accepter</button><button class="btn ghost small" data-ddecline="${d.id}">Refuser</button>`}
  else if(d.status==="playing_o"&&!d.mine){txt=`Duel en cours contre ${o} (${d.my_idx}/${d.total})`;acts=`<button class="btn small" data-duel="${d.id}">Continuer</button>`}
  else if(d.status==="playing_o"){txt=`Tu as fait <b>${d.c_correct}/${d.total}</b>. ${o} est en train de jouer…`}
  else if(d.status==="done"){const my=d.mine?d.c_correct:d.o_correct, th=d.mine?d.o_correct:d.c_correct;
    const r=d.winner===uid?`<span class="dl-res win">Victoire ${my}-${th}</span>`:d.winner?`<span class="dl-res lose">Défaite ${my}-${th}</span>`:`<span class="dl-res tie">Égalité ${my}-${th}</span>`;
    txt=`${r} contre ${o}${d.winner===uid&&d.stake?` · +${d.stake*2} bidons`:""}${d.winner===uid||!d.winner?"":th===my?" (plus lent)":""}`}
  else {txt=`Défi ${d.status==="declined"?(d.mine?`refusé par ${o}`:`refusé`):d.status==="cancelled"?"annulé":"expiré"} · mise remboursée`}
  return `<div class="dl">${st}<div class="dl-t">${txt}</div><div class="dl-a">${acts}</div></div>`;
}
function viewArena(){
  if(!arenaOn) return `<h2>Arène</h2><div class="empty">L'Arène n'est pas encore installée (lance maj-14-arene.sql dans Supabase).</div>`;
  let play="";
  if(qcur){
    const d=duels.find(x=>x.id===qcur.duel)||{};
    const b=brands[qcur.brand]||{name:QB[qcur.brand]||qcur.brand,color:"#23201C"};
    const opts=qcur.options.map((o,i)=>{let c="";if(qres){if(i===qres.answer)c="good";else if(i===qres.choice)c="bad";}
      return `<button class="qz-opt ${c}" data-qa="${i}" ${qres?"disabled":""}><span class="qz-l">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`}).join("");
    let fb="";
    if(qres){
      let endTxt="";
      if(qres.finished){
        if(qres.status==="waiting") endTxt=`<div class="qz-endline">Tu as fait <b>${qres.correct}/${qres.total}</b>. Ton adversaire a 48 h pour relever le défi.</div>`;
        else if(qres.status==="done") endTxt=`<div class="qz-endline">${qres.winner===uid?`🏆 <b>Victoire ${qres.o_correct}-${qres.c_correct}</b>${qres.stake?` · +${qres.stake*2} bidons`:""}`:qres.winner?`<b>Défaite ${qres.o_correct}-${qres.c_correct}</b>${qres.o_correct===qres.c_correct?" (ton adversaire a été plus rapide)":""}`:`<b>Égalité parfaite</b> · mises remboursées`}</div>`;
      }
      fb=`<div class="qz-fb ${qres.ok?"ok":"ko"}"><b>${qres.ok?"Bonne réponse !":qres.late?"Temps écoulé…":"Raté…"}</b> ${esc(qres.explanation||"")}</div>${endTxt}
      <button class="btn cta" data-act="qnext">${qres.finished?"Retour à l'Arène":"Question suivante"}</button>`;
    }
    play=`<div class="qz-card">
      <div class="qz-top"><span class="qz-brand" style="background:${esc(b.color)}">${esc(b.name||"")}</span><span class="qz-step">Question ${qcur.idx+1} / ${qcur.total}</span><span class="qz-score">vs ${esc(who(opp(d)))}</span></div>
      ${qres?"":`<div class="qz-time"><i id="qzBar"></i></div>`}
      <div class="qz-q">${esc(qcur.question).replace(/ ([?!:;»])/g,"&nbsp;$1")}</div>
      <div class="qz-opts">${opts}</div>${fb}</div>`;
    return `<h2>Arène</h2>${play}`;
  }
  const todo=duels.filter(d=>(!d.mine&&(d.status==="waiting"||d.status==="playing_o"))||(d.mine&&d.status==="playing_c"));
  const wait=duels.filter(d=>d.mine&&(d.status==="waiting"||d.status==="playing_o"));
  const past=duels.filter(d=>!["waiting","playing_c","playing_o"].includes(d.status));
  if(aBoard===null) loadArenaBoard();
  const board=aBoard&&aBoard.length?`<section class="feed"><h3>Classement de l'Arène</h3><ol class="qz-board">${aBoard.map((r,i)=>`<li class="${r.id===uid?"me":""}"><span class="n">${i+1}</span>${plink(r.id)}<span class="v">${r.wins} V · ${r.losses} D · ${r.net>=0?"+":""}${r.net} bidons</span></li>`).join("")}</ol></section>`:"";
  return `<h2>Arène</h2><p class="sub">Défie un collègue sur 5 questions produits. Vous jouez chacun quand vous voulez, les mêmes questions ; le meilleur score remporte la mise (égalité : le plus rapide).</p>
    <div class="gold-prog"><span class="pips">${Array.from({length:cfg.gold_every||3},(_,i)=>`<i class="${i<(me.duel_streak||0)?"on":""}"></i>`).join("")}</span><span>${me.duel_streak||0} / ${cfg.gold_every||3} victoires avant ton prochain <b>booster OR</b> (1 Légendaire garantie, parfois remplacée par une Shiny, et plus de cartes Équipe)</span></div>
    <div class="row"><button class="btn cta" data-act="newduel">⚔ Défier un joueur</button></div>
    ${todo.length?`<h3>À toi de jouer</h3><div class="dls">${todo.map(duelRow).join("")}</div>`:""}
    ${wait.length?`<h3>En attente de l'adversaire</h3><div class="dls">${wait.map(duelRow).join("")}</div>`:""}
    ${past.length?`<h3>Derniers duels</h3><div class="dls">${past.slice(0,12).map(duelRow).join("")}</div>`:(!todo.length&&!wait.length?`<div class="empty">Aucun duel pour l'instant. Lance le premier !</div>`:"")}
    ${board}`;
}
async function loadArenaBoard(){ if(aBoard!==null) return; aBoard=[]; try{ aBoard=await rpc("arena_board",{})||[]; if(tab==="arena"&&!qcur) render(); }catch(e){ aBoard=[]; } }
function quizTick(){
  clearInterval(qTimer);
  if(!qcur||qres) return;
  const step=()=>{const bar=document.getElementById("qzBar"); const left=qDeadline-Date.now(); const pct=Math.max(0,left/(qcur.seconds*1000)*100);
    if(bar){bar.style.width=pct+"%"; bar.classList.toggle("low",left<5000);}
    if(left<=0){clearInterval(qTimer); quizAnswer(null);} };
  step(); qTimer=setInterval(step,100);
}
async function duelPlay(id){
  if(qBusy) return; qBusy=true;
  try{ qcur=await rpc("duel_question",{did:id}); qres=null; qDeadline=Date.now()+qcur.remaining*1000; tab="arena"; }
  catch(e){ toast(errMsg(e)); qcur=null; try{ await loadGame(); }catch(_){} }
  finally{ qBusy=false; render(); scrollTo(0,0); }
}
async function quizAnswer(choice){
  if(qBusy||!qcur||qres) return; qBusy=true; clearInterval(qTimer);
  try{ const r=await rpc("duel_answer",{did:qcur.duel,choice}); qres={...r,choice};
    if(r.status==="done"){ const d=duels.find(x=>x.id===qcur.duel); if(d){ qres.c_correct=r.c_correct; qres.o_correct=r.o_correct; } } }
  catch(e){ toast(errMsg(e)); }
  finally{ qBusy=false; render(); }
}
async function quizNext(){
  if(qres&&qres.finished){ qcur=null; qres=null; aBoard=null; try{ await loadGame(); }catch(_){} render(); scrollTo(0,0); return; }
  const id=qcur.duel; qcur=null; duelPlay(id);
}
function openOfferDlg(lid){
  const l=listings.find(x=>x.id===lid); if(!l) return; const c=cardById[l.card]; const myOf=offers.find(o=>o.listing===lid&&o.buyer===uid);
  const def=myOf?myOf.price:Math.max(1,Math.round(l.price*0.8)), avail=me.coins+(myOf?myOf.price:0);
  const d=$("#dlg");

document.addEventListener("click",async e=>{

  if(ds.offer){openOfferDlg(+ds.offer);return}
  if(ds.ofcancel){await act(()=>rpc("cancel_offer",{offer_id:+ds.ofcancel}),"Offre annulée, tes bidons te sont rendus.");return}
  if(ds.ofok){t.disabled=true;await act(()=>rpc("answer_offer",{offer_id:+ds.ofok,accept:true}),"Vendu !");return}
  if(ds.ofno){t.disabled=true;await act(()=>rpc("answer_offer",{offer_id:+ds.ofno,accept:false}),"Offre refusée, l'acheteur est remboursé.");return}
  if(ds.buy){t.disabled=true;await act(()=>rpc("buy_listing",{listing_id:+ds.buy}),c=>`${cardById[c]?.name||"Carte"} achetée !`);return}
  if(ds.cancel){t.disabled=true;await act(()=>rpc("cancel_listing",{listing_id:+ds.cancel}),"Offre retirée, carte récupérée.");return}
  if(ds.accept){t.disabled=true;await act(()=>rpc("answer_trade",{trade_id:+ds.accept,accept:true}),"Échange conclu !");return}

    case "dupgo": {const k=$("#dupKeep").checked; t.disabled=true; closeDlg(); await act(()=>rpc("discard_duplicates",{keep_rare:k}),r=>r&&r.cards?`${r.cards} doublon${r.cards>1?"s":""} défaussé${r.cards>1?"s":""} : +${r.coins} bidons`:"Aucun doublon défaussé."); break}
    case "logout": closeDlg(); await sb.auth.signOut(); location.reload(); break;
    case "newtrade": openTradeDlg(null); break;
    case "tradewith": openTradeDlg(null,ds.to); break;
    case "tradefrom": closeDlg(); openTradeDlg(ds.give); break;
    case "tbsend": {if(!tb) break; const ex=o=>Object.entries(o).flatMap(([id,n])=>Array(n).fill(id)); const to=tb.to,g=ex(tb.gives),w=ex(tb.wants); closeDlg(); await act(()=>rpc("propose_trade_multi",{to_id:to,give_cards:g,want_cards:w}),"Proposition envoyée."); break}
    case "addcard": {const f=readAdminForm();f.c.push({id:"c"+Date.now().toString(36),name:"Nouveau produit",brand:f.b[0]?.id||"gs27",rarity:"C",descr:"",atk:30,def:30,shape:"flacon",active:true,img:"",job:"",sort:f.c.length});applyLocal(f);adminDirty=true;render(true);break}
    case "savecat": t.disabled=true; await saveCatalog(); t.disabled=false; break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="mkq"){mk.q=e.target.value;const L=document.getElementById("mkList");if(L)L.innerHTML=mkListHTML();return}});
document.addEventListener("toggle",e=>{if(e.target.id==="teamBox") teamOpen=e.target.open},true);
document.addEventListener("change",e=>{if(e.target.id==="mksort"){mk.sort=e.target.value;const L=document.getElementById("mkList");if(L)L.innerHTML=mkListHTML();}});
document.addEventListener("input",e=>{if(tab==="admin"&&e.target.closest("#cardsEd,#brandsEd"))adminDirty=true});

/* ---------- connexion ---------- */
const toEmail=p=>p.trim().toLowerCase()+"@"+LOGIN_DOMAIN;
function viewLogin(mode,err){
  loginMode=mode||loginMode;
  const signup=loginMode==="signup";
  $("#top").hidden=true;
  $("#main").innerHTML=`<div class="login">
    <div class="pack"><span class="sheen"></span><div class="mono">W</div><div class="t">WinaMasters</div><div class="s">Le jeu de cartes Winalco</div></div>
    <h2>${signup?"Créer mon compte":"Connexion"}</h2>
    <p class="sub">${signup?"Choisis un pseudo et un mot de passe. Le code d'invitation t'a été donné avec le lien.":"Entre ton pseudo et ton mot de passe."}</p>
    <form id="authForm">
      <label class="field">Pseudo<input id="psIn" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]{3,20}"></label>
      <label class="field">Mot de passe<input id="pwIn" type="password" autocomplete="${signup?"new-password":"current-password"}" required minlength="6"></label>
      ${signup?`<label class="field">Code d'invitation<input id="invIn" required autocomplete="off"></label>`:""}
      <div class="err">${esc(err||"")}</div>
      <button class="btn">${signup?"Créer mon compte":"Me connecter"}</button>
      <button type="button" class="linkbtn" data-act="${signup?"tologin":"tosignup"}">${signup?"J'ai déjà un compte":"Première fois ? Créer un compte"}</button>
    </form></div>`;
  $("#authForm").addEventListener("submit",async e=>{e.preventDefault();
    const btn=e.target.querySelector(".btn"); btn.disabled=true;
    const pseudo=$("#psIn").value.trim(), pw=$("#pwIn").value;
    if(signup){
      const invite=$("#invIn").value.trim();
      const {data:msg,error:ce}=await sb.rpc("signup_check",{p_pseudo:pseudo,p_invite:invite});
      if(ce) return viewLogin("signup",errMsg(ce));
      if(msg) return viewLogin("signup",msg);
      const {data,error}=await sb.auth.signUp({email:toEmail(pseudo),password:pw,options:{data:{pseudo,invite}}});
      if(error) return viewLogin("signup",/already|registered/i.test(error.message)?"Ce pseudo est déjà pris.":errMsg(error));
      if(!data.session) return viewLogin("login","Compte créé, mais la confirmation par e-mail est encore active dans Supabase : désactive-la (voir le guide).");
    }else{
      const {error}=await sb.auth.signInWithPassword({email:toEmail(pseudo),password:pw});
      if(error) return viewLogin("login","Pseudo ou mot de passe incorrect.");
    }
  });
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="tosignup")viewLogin("signup");
  if(b.dataset.act==="tologin")viewLogin("login");});

/* ---------- démarrage ---------- */
let started=false;
async function start(session){
  if(started) return; started=true;
  uid=session.user.id;
  $("#main").innerHTML=`<div class="empty">Chargement du jeu…</div>`;
  try{
    await rpc("ensure_player",{});
    cfg=await rpc("game_config",{});
    await loadCatalog(); await loadGame();
  }catch(e){ $("#main").innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`; return; }
  render(true); setTimeout(async()=>{ await maybeAnn(); if(!$("#dlg").open) maybeOath(); },600);
  sb.channel("jeu")
    .on("postgres_changes",{event:"*",schema:"public",table:"listings"},scheduleReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"trades"},scheduleReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"offers"},scheduleReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"feed"},scheduleReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"players"},scheduleReload)
    .subscribe();
  setInterval(()=>{
    if(bstate.next_at&&Date.now()>=Date.parse(bstate.next_at)) scheduleReload();
    if(bstate.oath_next&&!oathOpen()&&Date.now()>=Date.parse(bstate.oath_next)){ oathShown=false; scheduleReload(); setTimeout(maybeOath,2000); }
    renderWallet(); const n=document.getElementById("nextTxt"); if(n) n.innerHTML=nextText();
  },20000);
  setInterval(scheduleReload,60000);
}
(async()=>{
  if(!sb){$("#main").innerHTML=`<div class="empty">Fichier config.js manquant ou incomplet : il doit contenir l'URL et la clé Supabase.</div>`;return}
  const {data}=await sb.auth.getSession();
  if(data.session) start(data.session); else viewLogin("login");
  sb.auth.onAuthStateChange((ev,session)=>{ if(session&&!started) start(session); });
})();
</script>
